[package]
name = "asphalt_calculator"
version = "1.0.0"
description = "Petroleum and Asphalt Calculator (ASTM D1250 / D4311)"
authors = ["litao"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "asphalt_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
