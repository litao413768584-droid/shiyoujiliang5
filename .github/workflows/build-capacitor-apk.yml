name: Build Capacitor APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: Generate valid app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          convert xc:#2196F3 -resize 48x48 -fill white -gravity center -pointsize 30 -annotate 0 "A" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert xc:#2196F3 -resize 48x48 -fill white -gravity center -pointsize 30 -annotate 0 "A" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert xc:#FFFFFF -resize 48x48 -fill #2196F3 -gravity center -pointsize 20 -annotate 0 "A" android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          
          convert xc:#2196F3 -resize 72x72 -fill white -gravity center -pointsize 44 -annotate 0 "A" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert xc:#2196F3 -resize 72x72 -fill white -gravity center -pointsize 44 -annotate 0 "A" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert xc:#FFFFFF -resize 72x72 -fill #2196F3 -gravity center -pointsize 30 -annotate 0 "A" android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          
          convert xc:#2196F3 -resize 96x96 -fill white -gravity center -pointsize 60 -annotate 0 "A" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert xc:#2196F3 -resize 96x96 -fill white -gravity center -pointsize 60 -annotate 0 "A" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert xc:#FFFFFF -resize 96x96 -fill #2196F3 -gravity center -pointsize 40 -annotate 0 "A" android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          
          convert xc:#2196F3 -resize 144x144 -fill white -gravity center -pointsize 90 -annotate 0 "A" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert xc:#2196F3 -resize 144x144 -fill white -gravity center -pointsize 90 -annotate 0 "A" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert xc:#FFFFFF -resize 144x144 -fill #2196F3 -gravity center -pointsize 60 -annotate 0 "A" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          
          convert xc:#2196F3 -resize 192x192 -fill white -gravity center -pointsize 120 -annotate 0 "A" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert xc:#2196F3 -resize 192x192 -fill white -gravity center -pointsize 120 -annotate 0 "A" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          convert xc:#FFFFFF -resize 192x192 -fill #2196F3 -gravity center -pointsize 80 -annotate 0 "A" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true