name: Build Capacitor APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: Generate valid app icons with Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install pillow
          
          python3 << 'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont
          
          # 各分辨率配置
          sizes = [
              ('mipmap-mdpi', 48),
              ('mipmap-hdpi', 72),
              ('mipmap-xhdpi', 96),
              ('mipmap-xxhdpi', 144),
              ('mipmap-xxxhdpi', 192),
          ]
          
          bg_color = (33, 150, 243)  # 蓝色
          text_color = (255, 255, 255)  # 白色
          
          for folder, size in sizes:
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              
              # 创建 launcher icon (蓝色背景 + 白色文字)
              img = Image.new('RGB', (size, size), color=bg_color)
              draw = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf', size//2)
              except:
                  try:
                      font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size//2)
                  except:
                      font = ImageFont.load_default()
              draw.text((size//2, size//2), 'A', fill=text_color, anchor='mm', font=font)
              img.save(f'{path}/ic_launcher.png')
              
              # 创建 round icon (圆形)
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.ellipse([0, 0, size-1, size-1], fill=bg_color)
              try:
                  draw.text((size//2, size//2), 'A', fill=text_color, anchor='mm', font=font)
              except:
                  pass
              img.save(f'{path}/ic_launcher_round.png')
              
              # 创建 foreground icon (白色背景 + 蓝色文字)
              img = Image.new('RGB', (size, size), color=(255, 255, 255))
              draw = ImageDraw.Draw(img)
              try:
                  draw.text((size//2, size//2), 'A', fill=bg_color, anchor='mm', font=font)
              except:
                  pass
              img.save(f'{path}/ic_launcher_foreground.png')
          
          print("All icons generated successfully!")
          EOF
          
          # 验证文件
          find android/app/src/main/res -name "ic_launcher*.png" -ls

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true