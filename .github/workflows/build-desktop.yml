name: "Build App (EXE & APK)"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-exe:
    name: "Build Windows EXE"
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '石油及沥青计量计算器 v__VERSION__'
          releaseBody: '石油及沥青计量计算器 Windows 桌面安装包 (.exe) 与 Android 安装包 (.apk)'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petroleum-Calculator-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe

  build-apk:
    name: "Build Android APK"
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust target for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Init Tauri Android
        run: npx tauri android init --ci

      - name: Build Tauri app (.apk)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '石油及沥青计量计算器 v__VERSION__'
          releaseBody: '石油及沥青计量计算器 Windows 桌面安装包 (.exe) 与 Android 安装包 (.apk)'
          releaseDraft: true
          prerelease: false
          args: android build --apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petroleum-Calculator-Android-APK
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/*.apk
