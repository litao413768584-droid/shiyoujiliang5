name: Build Tauri Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        run: choco install nsis

      - name: Setup NSIS path
        run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Prepare icons directory and config
        run: |
          # 确保 icons 目录存在但为空
          New-Item -ItemType Directory -Path src-tauri/icons -Force
          # 删除目录内所有文件（如果有）
          Remove-Item -Path src-tauri/icons\* -Recurse -Force -ErrorAction SilentlyContinue
          # 生成配置文件
          @'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "asphalt_calculator",
            "version": "0.1.0",
            "identifier": "com.asphaltcalculator.app",
            "build": {
              "beforeDevCommand": "npm run dev",
              "devUrl": "http://localhost:1420",
              "beforeBuildCommand": "npm run build",
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [
                {
                  "title": "沥青计量"
                }
              ]
            },
            "bundle": {
              "icon": [],
              "targets": ["nsis", "msi"],
              "windows": {
                "certificateThumbprint": null,
                "digestAlgorithm": "sha256",
                "timestampUrl": ""
              }
            }
          }
          '@ > src-tauri/tauri.conf.json
          Get-Content src-tauri/tauri.conf.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npx tauri build --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/asphalt_calculator.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare icons directory and config
        run: |
          # 确保 icons 目录存在但为空
          mkdir -p src-tauri/icons
          # 删除目录内所有文件（如果有）
          rm -rf src-tauri/icons/*
          # 生成配置文件
          cat > src-tauri/tauri.conf.json << 'EOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "asphalt_calculator",
            "version": "0.1.0",
            "identifier": "com.asphaltcalculator.app",
            "build": {
              "beforeDevCommand": "npm run dev",
              "devUrl": "http://localhost:1420",
              "beforeBuildCommand": "npm run build",
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [
                {
                  "title": "沥青计量"
                }
              ]
            },
            "bundle": {
              "icon": []
            }
          }
          EOF
          cat src-tauri/tauri.conf.json

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build Android APK
        run: npx tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk